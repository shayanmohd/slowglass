  p { margin: 20px 0 0 2px; font-family: "Hanken Grotesk", sans-serif; font-weight: 500; font-size: 27px; line-height: 1.3; color: #F1EBFF; }
  /* A real emulator capture of a session in progress, in a plain rounded frame. */
  .phone { position: absolute; left: 718px; top: 40px; width: 276px; height: 480px; border-radius: 30px; background: #15141C; padding: 7px; box-sizing: border-box; box-shadow: 0 14px 40px rgba(58, 20, 130, 0.35); }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; border-radius: 24px; }
